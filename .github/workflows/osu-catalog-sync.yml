name: Sync OSU course catalog

on:
  schedule:
    - cron: "17 */4 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: osu-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate database configuration
        id: configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the repository Actions secret DATABASE_URL before the next scheduled run."
            exit 1
          fi

      - name: Check out repository
        id: checkout
        shell: bash
        run: |
          {
            git init --quiet .
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
            git checkout --detach --quiet FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          } 2>&1 | tee "$RUNNER_TEMP/catalog-checkout.log"

      - name: Set up Node.js 24 and pinned pnpm
        id: runtime
        shell: bash
        run: bash scripts/ci/setup-catalog-runtime.sh 2>&1 | tee "$RUNNER_TEMP/catalog-runtime.log"

      - name: Install runtime dependencies
        id: dependencies
        shell: bash
        run: pnpm install --prod --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/catalog-dependencies.log"

      - name: Sync the official OSU catalog
        id: catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: pnpm catalog:sync 2>&1 | tee "$RUNNER_TEMP/catalog-sync.log"

      - name: Refresh RMP identity and course evidence
        id: mapping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          {
            python3 -m venv "$RUNNER_TEMP/rmp-mapping-runtime"
            "$RUNNER_TEMP/rmp-mapping-runtime/bin/pip" install --disable-pip-version-check -r scripts/rmp/requirements.txt
            "$RUNNER_TEMP/rmp-mapping-runtime/bin/python" scripts/rmp/sync_rmp_mappings.py --require-schema
          } 2>&1 | tee "$RUNNER_TEMP/rmp-mapping.log"

      - name: Complete pending course change history
        id: changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: node scripts/catalog/backfill_changes.mjs --max-batches 12 --max-seconds 120 2>&1 | tee "$RUNNER_TEMP/change-backfill.log"

      - name: Repair and retain published search indexes
        id: indexes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: pnpm search:prepare 2>&1 | tee "$RUNNER_TEMP/search-prepare.log"

      - name: Refresh official academic calendar
        id: calendar
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        shell: bash
        run: node scripts/calendar/sync.mjs --apply 2>&1 | tee "$RUNNER_TEMP/calendar-sync.log"

      - name: Summarize catalog maintenance
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
          MAPPING_OUTCOME: ${{ steps.mapping.outcome }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          INDEX_OUTCOME: ${{ steps.indexes.outcome }}
          CALENDAR_OUTCOME: ${{ steps.calendar.outcome }}
        shell: bash
        run: |
          if [[ -f scripts/catalog/workflow-diagnostics.mjs ]] && command -v node >/dev/null; then
            node scripts/catalog/workflow-diagnostics.mjs
          else
            echo '::error title=Catalog setup failed::The diagnostic reporter could not start. Open the failed configuration, checkout or runtime step for its full log.'
            {
              echo '## Catalog maintenance setup failed'
              printf 'Configuration: %s. Checkout: %s. Runtime: %s. Dependencies: %s.\n' "$CONFIGURATION_OUTCOME" "$CHECKOUT_OUTCOME" "$RUNTIME_OUTCOME" "$DEPENDENCIES_OUTCOME"
              printf '\n[Open complete step logs](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
