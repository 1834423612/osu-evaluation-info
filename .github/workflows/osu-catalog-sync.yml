name: Sync OSU course catalog

on:
  schedule:
    - cron: "17 */4 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: osu-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the repository Actions secret DATABASE_URL before the next scheduled run."
            exit 1
          fi

      - name: Check out repository
        shell: bash
        run: |
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js 24 and pinned pnpm
        run: bash scripts/ci/setup-catalog-runtime.sh

      - name: Install runtime dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Sync the official OSU catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: pnpm catalog:sync 2>&1 | tee "$RUNNER_TEMP/catalog-sync.log"

      - name: Refresh RMP identity and course evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/rmp-mapping-runtime"
          "$RUNNER_TEMP/rmp-mapping-runtime/bin/pip" install --disable-pip-version-check -r scripts/rmp/requirements.txt
          "$RUNNER_TEMP/rmp-mapping-runtime/bin/python" scripts/rmp/sync_rmp_mappings.py --require-schema

      - name: Summarize catalog failure
        if: failure()
        shell: bash
        run: |
          {
            echo 'Catalog synchronization or maintenance failed. Inspect the failed step; published snapshots and source RMP records are retained.'
            if [[ -f "$RUNNER_TEMP/catalog-sync.log" ]]; then
              echo '```text'
              tail -n 20 "$RUNNER_TEMP/catalog-sync.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
